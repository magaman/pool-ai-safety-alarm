blueprint:
  name: Pool AI Safety Alarm
  description: >
    Analyze a pool camera with Home Assistant AI Task when UniFi Protect or
    other safety sensors trigger, classify the risk level, and route alerts to
    mobile notifications, speakers, sirens, and custom actions.
  source_url: https://github.com/magaman/pool-ai-safety-alarm/blob/main/blueprints/automation/pool_ai_safety_alarm.yaml
  domain: automation
  input:
    pool_camera:
      name: Pool camera
      description: Camera entity sent to AI Task for image analysis.
      selector:
        entity:
          filter:
            - domain: camera

    ai_task_entity:
      name: AI Task entity
      description: Home Assistant AI Task entity that supports camera/image attachments.
      selector:
        entity:
          filter:
            - domain: ai_task

    trigger_entities:
      name: Trigger entities
      description: >
        Entities that should start analysis when they turn on, such as UniFi
        Protect person detection, motion, gate, and door binary sensors.
      selector:
        entity:
          multiple: true

    run_conditions:
      name: Extra run conditions
      description: Optional conditions that must be true before analysis runs.
      default: []
      selector:
        condition: {}

    mobile_notify_devices:
      name: Mobile app notification devices
      description: >
        Select one or more Home Assistant Companion App devices. The blueprint
        derives each notify.mobile_app_* service from the selected device name.
      default: []
      selector:
        device:
          multiple: true
          filter:
            - integration: mobile_app

    speaker_entities:
      name: Speaker entities
      description: Optional media players for spoken WATER_ENTRY, DISTRESS, and DROWNING_RISK alerts.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: media_player

    tts_engine:
      name: TTS engine
      description: Optional TTS entity, such as tts.home_assistant_cloud. Leave blank to skip voice output.
      default: ""
      selector:
        text:

    siren_entities:
      name: Siren entities
      description: Optional sirens triggered only for DISTRESS and DROWNING_RISK.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: siren

    safe_actions:
      name: SAFE actions
      description: Optional actions when the pool appears safe.
      default: []
      selector:
        action:

    watch_actions:
      name: WATCH actions
      description: Optional actions for low-priority monitoring concerns.
      default: []
      selector:
        action:

    edge_risk_actions:
      name: EDGE_RISK actions
      description: Optional actions when someone is near the pool edge.
      default: []
      selector:
        action:

    water_entry_actions:
      name: WATER_ENTRY actions
      description: Optional actions when a person appears to enter or be in the water.
      default: []
      selector:
        action:

    distress_actions:
      name: DISTRESS actions
      description: Optional actions when the person appears distressed.
      default: []
      selector:
        action:

    drowning_risk_actions:
      name: DROWNING_RISK actions
      description: Optional actions for urgent drowning-risk scenes.
      default: []
      selector:
        action:

    error_actions:
      name: ERROR actions
      description: Optional actions when AI analysis fails or returns an invalid status.
      default: []
      selector:
        action:

mode: single
max_exceeded: silent

variables:
  pool_camera: !input pool_camera
  ai_task_entity: !input ai_task_entity
  mobile_notify_devices: !input mobile_notify_devices
  speaker_entities: !input speaker_entities
  tts_engine: !input tts_engine
  siren_entities: !input siren_entities
  allowed_statuses:
    - SAFE
    - WATCH
    - EDGE_RISK
    - WATER_ENTRY
    - DISTRESS
    - DROWNING_RISK
    - ERROR
  analysis_prompt: >
    You are a conservative pool safety classifier. Analyze the current pool
    camera image for people, children, pets, pool-edge proximity, water entry,
    distress, or drowning risk. Choose exactly one status.
    SAFE means no person or concerning activity is visible.
    WATCH means a person is near the pool area but not at the edge.
    EDGE_RISK means a person is close to the pool edge or behaving unsafely near it.
    WATER_ENTRY means a person has entered or appears to be in the water.
    DISTRESS means a person appears to need help, is struggling, or is calling/waving for help.
    DROWNING_RISK means a person may be submerged, motionless, face-down, trapped, or otherwise at immediate drowning risk.
    ERROR means the image cannot be analyzed confidently. Prefer the more severe
    status when uncertain between two risk levels.

triggers:
  - trigger: state
    entity_id: !input trigger_entities
    to: "on"

conditions:
  - condition: state
    entity_id: input_boolean.pool_ai_safety_enabled
    state: "on"
  - condition: and
    conditions: !input run_conditions

actions:
  - alias: Analyze the pool camera with Home Assistant AI Task
    action: ai_task.generate_data
    data:
      task_name: Pool AI Safety Alarm
      entity_id: "{{ ai_task_entity }}"
      instructions: "{{ analysis_prompt }}"
      structure:
        status:
          description: Pool safety status. Choose exactly one option.
          selector:
            select:
              options:
                - SAFE
                - WATCH
                - EDGE_RISK
                - WATER_ENTRY
                - DISTRESS
                - DROWNING_RISK
                - ERROR
        confidence:
          description: Confidence from 0 to 100.
          selector:
            number:
              min: 0
              max: 100
              step: 1
        summary:
          description: Brief description of what is visible in the pool image.
          selector:
            text:
        recommended_action:
          description: Short recommended next action for the homeowner.
          selector:
            text:
      attachments:
        media_content_id: "media-source://camera/{{ pool_camera }}"
        media_content_type: image/jpeg
    response_variable: pool_ai_response
    continue_on_error: true

  - alias: Normalize the AI response
    variables:
      response_status: "{{ pool_ai_response.data.status | default('ERROR') | upper }}"
      pool_ai_status: "{{ response_status if response_status in allowed_statuses else 'ERROR' }}"
      pool_ai_confidence: "{{ pool_ai_response.data.confidence | default(0) }}"
      pool_ai_summary: "{{ pool_ai_response.data.summary | default('Pool AI analysis failed or returned an invalid response.') }}"
      pool_ai_recommended_action: "{{ pool_ai_response.data.recommended_action | default('Review the camera and verify pool safety immediately.') }}"
      notification_title: "Pool safety: {{ pool_ai_status | replace('_', ' ') }}"
      notification_message: >-
        {{ pool_ai_summary }} Confidence: {{ pool_ai_confidence }}%.
        Recommended action: {{ pool_ai_recommended_action }}
      voice_message: >-
        Pool safety alert. {{ pool_ai_status | replace('_', ' ') }}.
        {{ pool_ai_recommended_action }}
      suppression_timer: >-
        {% if pool_ai_status == 'WATCH' %}timer.pool_ai_watch_suppression
        {% elif pool_ai_status == 'EDGE_RISK' %}timer.pool_ai_edge_risk_suppression
        {% elif pool_ai_status == 'WATER_ENTRY' %}timer.pool_ai_water_entry_suppression
        {% elif pool_ai_status == 'DISTRESS' %}timer.pool_ai_distress_suppression
        {% elif pool_ai_status == 'DROWNING_RISK' %}timer.pool_ai_drowning_risk_suppression
        {% elif pool_ai_status == 'ERROR' %}timer.pool_ai_error_suppression
        {% else %}{% endif %}
      is_suppressed: "{{ suppression_timer | trim != '' and is_state(suppression_timer | trim, 'active') }}"

  - alias: Store the current pool safety status
    action: input_select.select_option
    target:
      entity_id: input_select.pool_ai_safety_status
    data:
      option: "{{ pool_ai_status }}"

  - alias: Store the current pool safety summary
    action: input_text.set_value
    target:
      entity_id: input_text.pool_ai_safety_summary
    data:
      value: "{{ notification_message[:255] }}"

  - alias: Store the raw AI response
    action: input_text.set_value
    target:
      entity_id: input_text.pool_ai_safety_raw_response
    data:
      value: "{{ pool_ai_response | default({}) | to_json | truncate(255, true, '') }}"

  - alias: Send built-in mobile notifications
    if:
      - condition: template
        value_template: "{{ pool_ai_status != 'SAFE' and not is_suppressed and mobile_notify_devices | count > 0 }}"
    then:
      - repeat:
          for_each: "{{ mobile_notify_devices }}"
          sequence:
            - variables:
                notify_service: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
            - choose:
                - conditions: "{{ pool_ai_status in ['WATCH', 'EDGE_RISK', 'WATER_ENTRY', 'ERROR'] }}"
                  sequence:
                    - action: "{{ notify_service }}"
                      data:
                        title: "{{ notification_title }}"
                        message: "{{ notification_message }}"
                        data:
                          tag: "pool_ai_safety_alarm"
                          group: "pool_ai_safety"
                          actions:
                            - action: "POOL_AI_SUPPRESS_{{ pool_ai_status }}"
                              title: "Suppress {{ pool_ai_status | replace('_', ' ') }}"
                - conditions: "{{ pool_ai_status in ['DISTRESS', 'DROWNING_RISK'] }}"
                  sequence:
                    - action: "{{ notify_service }}"
                      data:
                        title: "{{ notification_title }}"
                        message: "{{ notification_message }}"
                        data:
                          tag: "pool_ai_safety_alarm"
                          group: "pool_ai_safety"
                          push:
                            sound:
                              name: default
                              critical: 1
                              volume: 1.0

  - alias: Speak water-entry and critical pool alerts
    if:
      - condition: template
        value_template: >-
          {{ pool_ai_status in ['WATER_ENTRY', 'DISTRESS', 'DROWNING_RISK']
             and not is_suppressed
             and tts_engine | trim != ''
             and speaker_entities | count > 0 }}
    then:
      - action: tts.speak
        target:
          entity_id: "{{ tts_engine }}"
        data:
          media_player_entity_id: "{{ speaker_entities }}"
          message: "{{ voice_message }}"

  - alias: Turn on sirens for critical pool alerts
    if:
      - condition: template
        value_template: >-
          {{ pool_ai_status in ['DISTRESS', 'DROWNING_RISK']
             and not is_suppressed
             and siren_entities | count > 0 }}
    then:
      - action: siren.turn_on
        target:
          entity_id: "{{ siren_entities }}"

  - alias: Run configured severity actions
    choose:
      - conditions: "{{ pool_ai_status == 'SAFE' }}"
        sequence: !input safe_actions
      - conditions: "{{ pool_ai_status == 'WATCH' and not is_suppressed }}"
        sequence: !input watch_actions
      - conditions: "{{ pool_ai_status == 'EDGE_RISK' and not is_suppressed }}"
        sequence: !input edge_risk_actions
      - conditions: "{{ pool_ai_status == 'WATER_ENTRY' and not is_suppressed }}"
        sequence: !input water_entry_actions
      - conditions: "{{ pool_ai_status == 'DISTRESS' and not is_suppressed }}"
        sequence: !input distress_actions
      - conditions: "{{ pool_ai_status == 'DROWNING_RISK' and not is_suppressed }}"
        sequence: !input drowning_risk_actions
      - conditions: "{{ pool_ai_status == 'ERROR' and not is_suppressed }}"
        sequence: !input error_actions
